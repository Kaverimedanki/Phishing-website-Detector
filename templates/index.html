<!DOCTYPE html>
<html>
<head>
    <title>Phishing Website Detector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 500px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 Phishing Website Detector</h1>

    <p>Check whether a website URL may be suspicious.</p>

    <form method="POST" action="/check">

        <input
            type="text"
            name="url"
            placeholder="https://example.com"
            required
        >

        <br>

        <button type="submit">Check URL</button>

    </form>

    <div class="info">
        Powered by Machine Learning
    </div>

</div>

</body>
</html>
